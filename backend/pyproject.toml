[project]
name = "idle-dynasty-backend"
version = "0.1.0"
description = "FastAPI backend for Idle Dynasty: guest auth, cloud saves, leaderboards"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "pymongo==4.19.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.uv]
# Application, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
